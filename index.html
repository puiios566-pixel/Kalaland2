// ============================================================
// توابع هش‌سازی
// ============================================================
async function hashString(str) {
  const encoder = new TextEncoder();
  const data = encoder.encode(str);
  const hashBuffer = await crypto.subtle.digest('SHA-256', data);
  const hashArray = Array.from(new Uint8Array(hashBuffer));
  return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
}

async function verifyAdminPassword(entered) {
  const enteredHash = await hashString(entered);
  return enteredHash === aPwHash;

  const enteredHash = await hashString(entered);

}
async function verifyGeneralCode(entered) {

  return enteredHash === generalCodeHash;
}

async function changePw() {
  var old = document.getElementById('oldPw').value;
  var newPw = document.getElementById('newPw').value;
  if (!old || !newPw) { toast('لطفاً هر دو فیلد را پر کنید', 'er'); return; }
  if (!(await verifyAdminPassword(old))) {
    toast('رمز فعلی اشتباه است', 'er');
    return;
  }
  const newHash = await hashString(newPw);
  localStorage.setItem('kl_pw_hash', newHash);
  aPwHash = newHash;
  toast('رمز با موفقیت تغییر کرد', 'ok');
}
async function changeWholesalePw() {
  var newPw = document.getElementById('newWholesalePw').value;
  if (!newPw || newPw.length < 4) {
    toast('رمز جدید باید حداقل ۴ کاراکتر باشد', 'er');
    return;
  }
  const newHash = await hashString(newPw);

  wholesalePwHash = newHash;
  toast('رمز همکاران با موفقیت تغییر کرد', 'ok');

  try {
    // پر کردن select والد
    var parSelect = document.getElementById('cPar');

    var html = '';

        html += '<h4 style="font-size:13px;margin:0;">'+indent+c.n+'</h4>';

          html += '<button class="dl" onclick="event.stopPropagation();toggleCatChildren(\''+expandId+'\')" id="btn_'+expandId+'" style="background:var(--bg);border:1px solid var(--d);width:28px;height:28px;border-radius:5px;font-size:12px;cursor:pointer;">▶</button>';

          html += '<div id="'+expandId+'" style="display:none;padding-right:18px;border-right:2px solid var(--d);margin:2px 0 6px 0;">';

          // ولی برای جلوگیری از حلقه بی‌نهایت، یک تابع داخلی دیگر تعریف می‌کنیم
          (function buildSub(pid2, lv) {

              var hasChild2 = cats.some(x => x.p === c2.id);
              var icon2 = c2.icon || '📁';
              html += '<div class="di" style="cursor:default;flex-wrap:wrap;padding:4px 8px;background:var(--bg);margin-bottom:4px;border-radius:6px;">';
              html += '<span style="font-size:16px;min-width:26px;">'+icon2+'</span>';
              html += '<div class="nf" style="flex:1;min-width:0;">';
              html += '<h4 style="font-size:12px;margin:0;">'+indent2+c2.n+'</h4>';
              html += '</div>';
              html += '<div style="display:flex;gap:3px;flex-shrink:0;">';
              html += '<button class="dl" onclick="event.stopPropagation();openEditCat('+c2.id+')" title="ویرایش" style="background:var(--m);color:#fff;border:none;width:24px;height:24px;border-radius:4px;font-size:10px;cursor:pointer;">✏️</button>';
              html += '<button class="dl" onclick="event.stopPropagation();if(confirm(\'آیا از حذف این دسته اطمینان دارید؟\')){delCat('+c2.id+')}" title="حذف" style="color:var(--no);border:none;background:transparent;width:24px;height:24px;border-radius:4px;font-size:10px;cursor:pointer;">🗑️</button>';
              html += '</div>';
              html += '</div>';
              // برای زیرمجموعه‌های سطح سوم هم می‌توان به همین صورت ادامه داد
              if (hasChild2) {
                // برای سادگی، زیرمجموعه‌های سطح سوم را به صورت تو در تو نمایش نمی‌دهیم (می‌توانیم بعداً اضافه کنیم)
                // فعلاً فقط یک پیغام نشان می‌دهیم
                html += '<div style="padding-right:20px;font-size:11px;color:var(--g);margin-bottom:4px;">↙ زیرمجموعه‌هایی دارد</div>';
              }
            });
          })(c.id, 1);
          html += '</div>';
        }
      });
    })(0, 0);
    container.innerHTML = html || '<div class="nr">دسته‌ای وجود ندارد</div>';
  } catch(e) { console.warn('renderCatsAdm error:', e); }
}

// تابع باز/بستن زیرمجموعه‌ها
function toggleCatChildren(id) {
  var el = document.getElementById(id);
  if (!el) return;
  if (el.style.display === 'none') {
    el.style.display = 'block';
    var btn = document.getElementById('btn_'+id);
    if (btn) btn.textContent = '▼';
  } else {
    el.style.display = 'none';
    var btn = document.getElementById('btn_'+id);
    if (btn) btn.textContent = '▶';
  }
}

// ============================================================
// توابع صفحه اصلی (مخفی کردن بخش‌های ویژه هنگام انتخاب دسته)
// ============================================================
function selectHomeCat(catId) {
  selCat = catId;
  selSubCat = 0;
  // مخفی کردن بخش‌های ویژه
  document.getElementById('ofSec').style.display = 'none';
  document.getElementById('sgSec').style.display = 'none';
  // به‌روزرسانی منو و محصولات
  renderHomeMenu();
  renderHomeProducts();
  // نمایش پیام
  var catName = cats.find(c => c.id === catId)?.n || '';
  document.getElementById('pTtl').textContent = catName ? '📂 '+catName : 'همه محصولات';
}

function selectHomeSubCat(subId) {
  selSubCat = subId;
  // مخفی کردن بخش‌های ویژه
  document.getElementById('ofSec').style.display = 'none';
  document.getElementById('sgSec').style.display = 'none';
  // به‌روزرسانی
  renderHomeMenu();
  renderHomeProducts();
  var subName = cats.find(c => c.id === subId)?.n || '';
  document.getElementById('pTtl').textContent = subName ? '📂 '+subName : 'همه محصولات';
}

// تابع بازگشت به حالت پیش‌فرض (نمایش همه محصولات و بخش‌های ویژه)
function goHome() {
  selCat = 1;
  selSubCat = 0;
  document.getElementById('ofSec').style.display = 'block';
  document.getElementById('sgSec').style.display = 'block';
  renderHomeMenu();
  renderHomeProducts();
  document.getElementById('pTtl').textContent = 'همه محصولات';
  // تغییر تب ناوبری
  document.querySelectorAll('.nv').forEach(b => b.classList.remove('on'));
  document.querySelector('.nv:first-child')?.classList.add('on');
  // نمایش صفحه خانه
  document.querySelectorAll('.pg').forEach(p => p.classList.remove('on'));
  document.getElementById('pgH').classList.add('on');
}

// ============================================================
// تابع رندر محصولات صفحه اصلی (بر اساس selCat و selSubCat)
// ============================================================
function renderHomeProducts() {
  var grid = document.getElementById('pGrid');
  if (!grid) return;
  var filtered = [];
  if (selSubCat !== 0) {
    // نمایش محصولات زیرمجموعه انتخاب شده
    filtered = prods.filter(p => p.c === selSubCat);
  } else if (selCat !== 0) {
    // نمایش محصولات دسته اصلی و تمام زیرمجموعه‌های آن
    var leafIds = getLeafIds(selCat);
    filtered = prods.filter(p => leafIds.includes(p.c));
  } else {
    filtered = prods;
  }
  if (filtered.length === 0) {
    grid.innerHTML = '<div class="nr">محصولی در این دسته یافت نشد</div>';
    return;
  }
  var html = '';
  filtered.forEach(p => {
    var price = getProductPrice(p);
    html += '<div class="pc">';
    html += '<div class="pi" onclick="viewProduct('+p.id+')">';
    if (p.img) html += '<img src="'+p.img+'" alt="'+p.n+'" loading="lazy">';
    else html += '<span class="iconify" data-icon="mdi:image-off"></span>';
    html += '</div>';
    html += '<div class="pn" onclick="viewProduct('+p.id+')">'+p.n+'</div>';
    if (p.dc) html += '<div class="pd">'+p.dc+'</div>';
    html += '<div class="pp">'+fp(price)+' تومان</div>';
    html += '<div class="pu">واحد: '+p.u+'</div>';
    html += '<div class="pq"><button class="qb" onclick="changeQty('+p.id+',-1)">−</button><span class="qv" id="qty_'+p.id+'">'+(qt[p.id]||0)+'</span><button class="qb" onclick="changeQty('+p.id+',1)">+</button></div>';
    html += '<button class="ba" onclick="addToCart('+p.id+')"><span class="iconify" data-icon="mdi:cart-plus"></span> افزودن</button>';
    html += '</div>';
  });
  grid.innerHTML = html;
}

function init() {
  try {
    userMode = localStorage.getItem('kl_user_mode') || 'retail';
    wholesaleVerified = localStorage.getItem('kl_wholesale_verified') === 'true';
    updateUserModeTabs();
    selCat = 1;
    selSubCat = 0;
    hideSpecials = false;
    // نمایش بخش‌های ویژه در ابتدا
    document.getElementById('ofSec').style.display = 'block';
    document.getElementById('sgSec').style.display = 'block';
    renderHomeMenu();
    renderHomeProducts();
    renderSections();
    updateBadge();
    renderSoc();
    // تنظیم کیفیت عکس
    var slider = document.getElementById('imgQualitySlider');
    if(slider){ slider.value = imageQuality; document.getElementById('imgQualityLabel').textContent = imageQuality+'%'; }
    // رویداد آپلود عکس
    document.getElementById('pFile')?.addEventListener('change', function(e) {
      var file = e.target.files[0];
      if (!file) return;
      compressImage(file, function(dataUrl) {
        document.getElementById('pUrl').value = dataUrl;
        toast('عکس با کیفیت ' + imageQuality + '% فشرده شد', 'ok');
      });
    });
    document.getElementById('editCatIconFile')?.addEventListener('change', function(e){
      var file = e.target.files[0];
      if(!file) return;
      compressImage(file, function(dataUrl){
        document.getElementById('editCatIcon').value = dataUrl;
        toast('آیکون با موفقیت آپلود شد','ok');
      });
    });
    console.log('✅ نسخه v3.4 کافی‌لند با موفقیت بارگذاری شد!');
    console.log('🔐 حالت امن: رمزها با SHA-256 هش شده‌اند.');
    console.log('📂 قابلیت باز شدن زیرمجموعه‌ها در پنل مدیریت فعال شد.');
  } catch(e) {
    console.warn('خطا در init:', e);
    toast('خطا در بارگذاری سایت', 'er');
  }
}
window.addEventListener('DOMContentLoaded', init);
