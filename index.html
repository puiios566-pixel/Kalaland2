function init(){
    try{
        blockRightClickAndKeys();
        userMode = localStorage.getItem('kl_user_mode') || 'retail';
        wholesaleVerified = localStorage.getItem('kl_wholesale_verified') === 'true';
        updateUserModeTabs();
        selCat = 1;
        var subCats = cats.filter(function(c){ return c.p === selCat; });
        if(subCats.length > 0){ selSubCat = subCats[0].id; } else { selSubCat = 0; }
        hideSpecials = false;
        renderHomeMenu();
        renderHomeProducts();
        renderSections();
        updateBadge();
        renderSoc();
        var secretBtn = document.getElementById('secretAdminBtn');
        if(secretBtn) secretBtn.style.display = 'block';
        var slider = document.getElementById('imgQualitySlider');
        if(slider){ slider.value = imageQuality; document.getElementById('imgQualityLabel').textContent = imageQuality+'%'; }
        document.getElementById('pFile').addEventListener('change', function(e) {
            var file = e.target.files[0];
            if (!file) return;
            compressImage(file, function(dataUrl) {
                document.getElementById('pUrl').value = dataUrl;
                toast('عکس با کیفیت ' + imageQuality + '% فشرده شد', 'ok');
            });
        });
        console.log('✅ نسخه نهایی کافی‌لند با داده‌های جدید بارگذاری شد!');
    }catch(e){ console.warn('خطا در init:', e); toast('خطا در بارگذاری سایت','er'); }
}
